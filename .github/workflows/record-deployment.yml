name: Record deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment that was deployed (must match an existing row)
        type: choice
        options: [dev1, dev2, dev3, dev4, dev5, dev6]
        required: true
      branch:
        description: Deployed branch name (must match an existing row)
        type: string
        default: main
        required: true
      deployed_at:
        description: "Deployment time with timezone (e.g. 2026-11-24T09:00:00+11:00); leave blank for now"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deployment-data
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/main" ]; then
            echo "::error::Select the main branch to record a deployment."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test deployment recording
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Record deployment
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_BRANCH: ${{ inputs.branch }}
          DEPLOYED_AT: ${{ inputs.deployed_at }}
        run: python3 scripts/record_deployment.py
      - name: Save deployment
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/deployments.json
          if ! git diff --cached --quiet; then
            git commit -m "Record deployment by ${GITHUB_ACTOR}"
            git push origin HEAD:main
          fi

  # GITHUB_TOKEN pushes do not trigger the push-based Pages workflow.
  publish:
    needs: record
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
